apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-deployment
spec:
  selector:
    matchLabels:
      app: ev
  replicas: 1
  template:
    metadata:
      labels:
        app: ev
    spec:
      containers:
      - name: ev
        image: tsapp:latest
        args: ["ev"]
        ports:
        - containerPort: 5000
        imagePullPolicy: Never # using local images for testing
        volumeMounts:
          - name: logs-results-storage
            mountPath: /persistent_data # generated data+logs to be stored here. Eventually this will be network storage.
      volumes:
        - name: logs-results-storage
          persistentVolumeClaim:
            claimName: logs-results-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: ev-service
spec:
  selector:
    app: ev
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
